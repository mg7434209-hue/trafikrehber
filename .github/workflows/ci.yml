name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trafikrehber_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trafikrehber_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated test services
        env:
          DATABASE_URL: sqlite:////tmp/trafikrehber-e2e.db
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          python backend/tests/seed_preview.py
          (cd backend && uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1) &
          (cd frontend && npm run serve > /tmp/frontend.log 2>&1) &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:3000/api/stats/visitors; then exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log /tmp/frontend.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
          retention-days: 7
